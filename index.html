<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Expert - Cricket Analysis Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
        }

        /* Background image with dark overlay so text is clearly visible */
        .bg-container {
            background-image: linear-gradient(rgba(11, 19, 30, 0.8), rgba(11, 19, 30, 0.85)), url('bg.jpg');
            background-size: cover;
            background-position: center top;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Card Container */
        .portal-card {
            background: linear-gradient(135deg, rgba(16, 28, 45, 0.9), rgba(8, 15, 25, 0.9));
            border: 2px solid rgba(0, 162, 255, 0.4);
            box-shadow: 0 0 35px rgba(0, 140, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
        }

        /* Top Badge */
        .top-badge {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Heading */
        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Stacked Telegram Join Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

            color: #ffffff;

            border-radius: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
